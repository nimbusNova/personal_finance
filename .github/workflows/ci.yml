name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
    - run: bun install
      working-directory: ./web
    - run: bun run build
      working-directory: ./web
    - run: bun run test
      working-directory: ./web
    - run: bun run lint
      working-directory: ./web
      continue-on-error: true
